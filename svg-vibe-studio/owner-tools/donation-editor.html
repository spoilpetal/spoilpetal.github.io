<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation Config Editor — Owner Tool</title><style>body{font:14px system-ui;max-width:900px;margin:30px auto;padding:0 18px;background:#070b08;color:#eaf5ee}input,select{background:#0c1510;color:#eaf5ee;border:1px solid #20352a;padding:7px;border-radius:6px}button{padding:8px 12px;margin:5px;border:1px solid #42634f;background:#0c1510;color:#eaf5ee;border-radius:7px}.card{border:1px solid #20352a;padding:14px;margin:10px 0;border-radius:8px}label{display:grid;gap:4px;margin:6px 0;color:#9eb1a5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}.toast{position:fixed;right:16px;bottom:16px;background:#e0ffe8;color:#00220d;padding:9px 12px;border-radius:8px;font-weight:800;opacity:0;pointer-events:none;transition:.15s;z-index:99}.toast.show{opacity:1}</style></head><body><div id="toast" class="toast" role="status" aria-live="polite"></div><h1>Donation Config — Owner Tool</h1><p>This tool is for your local project files. The public donation page has no editor. Changes can be stored in this browser for local preview, imported from a config file, or exported for the GitHub Pages deployment.</p><p><button id="openFile">Open donation-config.js</button> <button id="importFile">Import config</button> <input id="importInput" type="file" accept=".js,application/javascript,text/javascript" hidden> <span id="fileStatus">No file opened.</span></p><div id="list"></div><button id="add">Add method</button><button id="export">Export donation-config.js</button><script src="../donation-config.js"></script><script>
let methods=(window.SVG_VIBE_DONATIONS?.methods||[]).map(x=>({...x}));let fileHandle=null;const $=s=>document.querySelector(s);
function render(){const box=$('#list');box.innerHTML='';methods.forEach((m,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="grid"><label>Type<select data-k="type"><option value="crypto">Crypto</option><option value="link">Payment link</option><option value="custom">Custom</option></select></label><label>Name<input data-k="name"></label><label data-value-label>Address / URL<input data-k="value"></label><label data-content-label>Custom details<textarea data-k="content" rows="4" style="width:100%;background:#0c1510;color:#eaf5ee;border:1px solid #20352a;padding:7px;border-radius:6px"></textarea></label><label>Icon URL or symbol<input data-k="icon"></label><label>Network / note<input data-k="note"></label><label>Enabled<select data-k="enabled"><option value="true">Yes</option><option value="false">No</option></select></label></div><button data-save>Save method</button><button data-del>Remove</button>`;for(const k of ['type','name','icon','note','content']){const el=d.querySelector(`[data-k="${k}"]`);if(el)el.value=m[k]||''}d.querySelector('[data-k="type"]').value=m.type==='other'?'custom':(m.type||'crypto');d.querySelector('[data-k="value"]').value=m.address||m.url||'';d.querySelector('[data-content-label]').style.display=(m.type==='other'||m.type==='custom')?'grid':'none';d.querySelector('[data-value-label]').style.display=(m.type==='other'||m.type==='custom')?'none':'grid';d.querySelector('[data-k="type"]').onchange=()=>{const t=d.querySelector('[data-k="type"]').value;const custom=t==='custom'||t==='other';d.querySelector('[data-content-label]').style.display=custom?'grid':'none';d.querySelector('[data-value-label]').style.display=custom?'none':'grid'};d.querySelector('[data-k="enabled"]').value=String(m.enabled!==false);d.querySelector('[data-save]').onclick=()=>{const v=k=>d.querySelector(`[data-k="${k}"]`).value;const type=v('type');m={type,name:v('name').trim(),icon:v('icon').trim(),note:v('note').trim(),enabled:v('enabled')==='true',...(type==='crypto'?{address:v('value').trim()}:type==='link'?{url:v('value').trim()}:{content:d.querySelector('[data-k="content"]').value.trim()})};methods[i]=m;render();persistLocal();toast('Payment method saved.')};d.querySelector('[data-del]').onclick=()=>{methods.splice(i,1);render();persistLocal();toast('Payment method removed.')};box.appendChild(d)})}
function configText(){return '/* Generated by SVG Vibe Studio owner tool. */\nwindow.SVG_VIBE_DONATIONS = '+JSON.stringify({version:1,methods},null,2)+';\n'}
function persistLocal(){try{localStorage.setItem('svg-vibe-donation-config',JSON.stringify({version:1,methods}))}catch{}}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem('svg-vibe-donation-config')||'null');if(x&&Array.isArray(x.methods)){methods=x.methods.map(v=>({...v}));render();$('#fileStatus').textContent='Loaded saved browser copy.'}}catch{}}
async function saveConfig(){persistLocal();const js=configText();if(fileHandle){try{const w=await fileHandle.createWritable();await w.write(js);await w.close();$('#fileStatus').textContent='Saved donation-config.js';toast('Donation configuration saved.');return}catch(e){$('#fileStatus').textContent='Direct save unavailable; exported instead.'}}const b=new Blob([js],{type:'application/javascript'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='donation-config.js';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);$('#fileStatus').textContent='Exported donation-config.js. Replace the deployed public config file with it.'}
async function openConfig(){if(!window.showOpenFilePicker){$('#fileStatus').textContent='Use Import config here, then Export.';return}try{const [h]=await window.showOpenFilePicker({multiple:false,types:[{description:'JavaScript',accept:{'text/javascript':['.js']}}]});const f=await h.getFile();if(f.name!=='donation-config.js')throw new Error('Choose donation-config.js.');fileHandle=h;const text=await f.text();const m=text.match(/window\.SVG_VIBE_DONATIONS\s*=\s*(\{[\s\S]*\})\s*;/);if(!m)throw new Error('Could not find donation configuration.');const parsed=JSON.parse(m[1]);methods=Array.isArray(parsed.methods)?parsed.methods:[];persistLocal();render();$('#fileStatus').textContent='Opened '+f.name}catch(e){$('#fileStatus').textContent=e.message||'File was not opened.'}}
function importConfigFile(f){const r=new FileReader();r.onload=()=>{try{const m=String(r.result).match(/window\.SVG_VIBE_DONATIONS\s*=\s*(\{[\s\S]*\})\s*;/);if(!m)throw new Error('Invalid donation-config.js');const parsed=JSON.parse(m[1]);if(!Array.isArray(parsed.methods))throw new Error('No methods found');methods=parsed.methods.map(v=>({...v}));persistLocal();render();$('#fileStatus').textContent='Imported '+f.name+' and saved local preview.';toast('Donation configuration imported.')}catch(e){$('#fileStatus').textContent=e.message}};r.readAsText(f)}
function preview(){persistLocal();const raw=btoa(unescape(encodeURIComponent(JSON.stringify({version:1,methods}))));window.open('../donation.html#config='+encodeURIComponent(raw),'_blank')}
$('#openFile').onclick=openConfig;$('#importFile').onclick=()=>$('#importInput').click();$('#importInput').onchange=e=>e.target.files[0]&&importConfigFile(e.target.files[0]);$('#add').onclick=()=>{methods.push({type:'crypto',name:'',address:'',icon:'',note:'',enabled:true});render();persistLocal();toast('Payment method added.');};$('#export').onclick=saveConfig;const previewBtn=document.createElement('button');previewBtn.textContent='Preview donation page';previewBtn.onclick=preview;$('#export').after(previewBtn);loadLocal();render();
</script></body></html>
