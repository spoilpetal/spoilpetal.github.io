<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact · SVG Vibe Studio</title><style>:root{--bg:#070b08;--panel:#0d1510;--line:#20352a;--text:#eaf5ee;--muted:#9eb1a5;--accent:#7cffc4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#183824 0,#070b08 40%);color:var(--text);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:820px;margin:auto;padding:28px 20px 60px}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px}a{color:var(--accent)}h1{font-size:34px;line-height:1.15;margin:0 0 8px}.muted{color:var(--muted)}form{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px;margin-top:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:4px;color:var(--muted);font-size:12px}input,textarea{width:100%;background:#070c09;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:8px}textarea{min-height:180px;resize:vertical}.full{grid-column:1/-1}.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button{border:1px solid var(--line);background:#0c1510;color:var(--text);border-radius:7px;padding:8px 12px;cursor:pointer}button.primary{background:var(--accent);color:#001300;border-color:var(--accent);font-weight:800}.note{border-left:3px solid var(--accent);background:#0a160e;padding:10px 12px;margin-top:16px;font-size:13px;color:#cfe2d5}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main><nav><a href="./index.html">← Studio</a><a href="./guides/index.html">Guides</a><a href="./donation.html">Support</a></nav><h1>Contact</h1><p class="muted">Send a message to the project owner.</p><div class="note">This site has no backend. Submitting this form opens your email application with the message filled in and addressed to <strong>spoilpetal@proton.me</strong>. The message is sent by your email provider, not by this website.</div><form id="contactForm"><div class="grid"><label>Name<input id="name" required autocomplete="name"></label><label>Your email<input id="email" type="email" required autocomplete="email"></label><label class="full">Subject<input id="subject" required value="SVG Vibe Studio contact"></label><label class="full">Message<textarea id="message" required></textarea></label></div><div class="row"><button class="primary" type="submit">Open email</button><button type="button" id="copyEmail">Copy email address</button></div></form></main><script>document.getElementById('contactForm').onsubmit=e=>{e.preventDefault();const n=document.getElementById('name').value.trim(),em=document.getElementById('email').value.trim(),su=document.getElementById('subject').value.trim(),m=document.getElementById('message').value.trim();const body=`Name: ${n}\nEmail: ${em}\n\n${m}`;location.href=`mailto:spoilpetal@proton.me?subject=${encodeURIComponent(su)}&body=${encodeURIComponent(body)}`};document.getElementById('copyEmail').onclick=async()=>{try{await navigator.clipboard.writeText('spoilpetal@proton.me')}catch{prompt('Email address:','spoilpetal@proton.me')}};</script></body></html>
