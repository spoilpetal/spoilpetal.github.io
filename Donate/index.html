<!doctype html><!--donation.html --><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donate if you want</title><style>:root{--bg:#070b08;--panel:#0d1510;--line:#20352a;--text:#eaf5ee;--muted:#9eb1a5;--accent:#7cffc4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#183824 0,#070b08 40%);color:var(--text);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:900px;margin:auto;padding:28px 20px 60px}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px}a{color:var(--accent)}h1{font-size:34px;line-height:1.15;margin:0 0 8px}.muted{color:var(--muted)}.method{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px;margin:10px 0}.icon{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:#111d16;border:1px solid var(--line);font-weight:900}.icon img{max-width:30px;max-height:30px}.name{font-weight:800}.meta{font-size:12px;color:var(--accent);margin-top:2px;text-transform:capitalize}.note{font-size:13px;color:var(--muted);margin-top:3px}.custom-content{white-space:normal;line-height:1.7;padding-top:6px;border-top:1px solid var(--line);margin-top:8px}.address{font:12px ui-monospace,monospace;word-break:break-all;color:#cce6d6}.btn,button{border:1px solid var(--line);background:#0c1510;color:var(--text);border-radius:7px;padding:7px 10px;cursor:pointer;text-decoration:none}.btn:hover,button:hover{border-color:#668675}.status{min-height:22px;margin-top:10px;color:var(--accent);font-size:13px}.empty{border:1px dashed var(--line);padding:18px;border-radius:10px;color:var(--muted)}@media(max-width:700px){main{padding:20px 14px 40px}.method{grid-template-columns:auto 1fr}.method .actions{grid-column:2}.method .actions .btn,.method .actions button{width:100%}nav{gap:10px 14px}h1{font-size:29px}}</style><link rel="stylesheet" href="./vibe-ui.css"><link rel="icon" type="image/png" href="donate-logo.png"></head><body class="page-donation"><noscript><div style="position:fixed;z-index:2147483647;left:14px;right:14px;bottom:14px;padding:14px 16px;border:1px solid #d98d74;border-radius:14px;background:#241b17;color:#fff8f2;font:600 14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;box-shadow:0 18px 60px rgba(0,0,0,.35)">JavaScript is disabled. This requires JavaScript for the editor, animations, controls, Status tools, and Appearance settings. Please enable JavaScript and reload.</div></noscript><main><nav><a href="./contact.html">Contact</a></nav><h1>Donate if you find something usefull (don't force)</h1><p class="muted">If you want to support the project, choose any available payment method below. There is no required amount or subscription.</p><div id="methods"></div><p id="empty" class="empty" hidden>No payment methods are currently configured.</p><div id="status" class="status" role="status" aria-live="polite"></div></main><script src="./donation-config.js"></script><script>
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function readDonationConfig(){
  let cfg=window.SVG_VIBE_DONATIONS&&typeof window.SVG_VIBE_DONATIONS==='object'?window.SVG_VIBE_DONATIONS:{methods:[]};
  try{const local=localStorage.getItem('svg-vibe-donation-config');if(local){const parsed=JSON.parse(local);if(parsed&&Array.isArray(parsed.methods))cfg=parsed}}catch{}
  try{if(location.hash.startsWith('#config=')){const raw=decodeURIComponent(location.hash.slice(8));const parsed=JSON.parse(decodeURIComponent(escape(atob(raw))));if(parsed&&Array.isArray(parsed.methods))cfg=parsed}}catch{}
  return cfg;
}
function iconHtml(m){const i=String(m.icon||'').trim();return i.startsWith('http://')||i.startsWith('https://')?`<img src="${esc(i)}" alt="">`:esc(i||'↗')}
function render(){const cfg=readDonationConfig(),methods=Array.isArray(cfg.methods)?cfg.methods:[],box=$('methods'),active=methods.filter(m=>m.enabled!==false);box.innerHTML='';$('empty').hidden=active.length>0;active.forEach(m=>{const el=document.createElement('div');el.className='method';const rawType=String(m.type||'custom');const type=rawType==='other'?'custom':rawType;const value=String(type==='crypto'?(m.address||''):(type==='link'?(m.url||''):(m.content||m.url||'')));let action='';if(type==='crypto'){action=`<button class="copy">Copy address</button>`}else if(type==='link'){action=value?`<a class="btn" href="${esc(value)}" target="_blank" rel="noopener">Open link</a>`:''}else{action=value?`<button class="btn expand" type="button">Expand details</button>`:''}el.innerHTML=`<div class="icon">${iconHtml(m)}</div><div><div class="name">${esc(m.name||'Payment method')}</div><div class="meta">${esc(type)}${m.network?` · ${esc(m.network)}`:''}</div>${type==='crypto'&&value?`<div class="address">${esc(value)}</div>`:''}${m.note?`<div class="note">${esc(m.note)}</div>`:''}${type==='custom'?`<div class="note custom-content" hidden>${esc(value).replace(/\n/g,'<br>')}</div>`:''}</div><div class="actions">${action}</div>`;if(type==='crypto'){el.querySelector('.copy').onclick=async()=>{try{await navigator.clipboard.writeText(value);el.querySelector('.copy').textContent='Copied';$('status').textContent='Address copied.';setTimeout(()=>el.querySelector('.copy').textContent='Copy address',1200)}catch{$('status').textContent='Clipboard unavailable; address shown in the prompt.';prompt('Copy this address:',value)}}}else if(type==='custom'&&value){el.querySelector('.expand').onclick=()=>{const box=el.querySelector('.custom-content');const open=box.hidden;box.hidden=!open;el.querySelector('.expand').textContent=open?'Collapse details':'Expand details';$('status').textContent=open?'Custom payment details expanded.':''}}box.appendChild(el)})}
render();window.addEventListener('hashchange',render);
</script><script src="./vibe-ui.js"></script></body></html>
